plugins {
    id 'com.android.application'
}

android {
    namespace 'com.rdx.loader'
    compileSdk 36

    defaultConfig {
        applicationId "com.rdx.loader"
        minSdk 24
        targetSdk 33
        versionCode 8
        versionName "0.0.8"

        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    signingConfigs {
        release {
            if (file('../keystore/release.keystore').exists()) {
                storeFile file('../keystore/release.keystore')
                storePassword 'featurestic2026'
                keyAlias 'featurestic'
                keyPassword 'featurestic2026'
            } else if (file('../keystore/debug.keystore').exists()) {
                storeFile file('../keystore/debug.keystore')
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            debuggable true
            signingConfig signingConfigs.release
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
            pickFirsts += ['**/*.so']
        }
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE', 'META-INF/NOTICE']
        }
    }
}

dependencies {
    // 1-Line AAR Integration - FeaturesticBox Virtual Engine
    implementation fileTree(dir: 'libs', include: ['*.aar', '*.jar'])

    implementation 'com.github.CodingGay.BlackReflection:core:1.1.2'
    implementation 'com.github.tiann:FreeReflection:3.2.2'
    implementation 'org.lsposed.lsparanoid:core:0.6.0'

    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.core:core:1.12.0'
    implementation('org.lsposed.hiddenapibypass:hiddenapibypass:4.3') {
        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
    }
}

// Remove duplicate kotlin-stdlib-jdk7/jdk8 that conflict with kotlin-stdlib 1.8.x
configurations.all {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}
